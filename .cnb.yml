# CNB 流水线：Flutter 项目编译并产出 APK
#
# 背景：当前仓库只有根目录的 main.dart / api.dart / models.dart 和 pubspec.yaml，
#       缺少标准 Flutter 工程结构（android/、lib/ 等），因此无法直接打包。
#       流水线在构建时先 `flutter create` 补全结构，把根目录源码移入 lib/，再打包。
#
# 触发与产物：
#   - push 到 main  → 构建 APK，自动更新「nightly」Release 并作为附件上传（在 Release 页下载）
#   - 推送 tag      → 构建 APK、自动生成对应 tag 的 Release，并作为「Release 附件」上传
#
# 镜像：cirrusci/flutter:stable（已含完整 Flutter + Android SDK）
#       若拉取慢，可改用 CNB 镜像代理：mirrors.cnb.cool/docker.io/cirrusci/flutter:stable

main:
  push:
    - name: build-apk
      docker:
        image: cirrusci/flutter:stable
        volumes:
          - flutter_gradle:/root/.gradle:rw
      stages:
        - name: 补全工程结构
          script: |
            set -e
            if [ ! -d android ]; then
              flutter create --platforms=android .
            fi
            rm -f lib/main.dart test/widget_test.dart
            mv main.dart api.dart models.dart lib/
        - name: 安装依赖
          script: flutter pub get
        - name: 静态分析
          script: flutter analyze
        - name: 构建 APK
          script: flutter build apk --release --no-pub
        - name: 发布 Nightly Release
          type: git:release
          options:
            tag: nightly
            overlying: true
            title: Nightly
            description: 每次 push 到 main 自动构建
        - name: 上传 APK 到 Release 附件（插件）
          image: cnbcool/attachments:latest
          settings:
            tag: nightly
            attachments:
              - ./build/app/outputs/flutter-apk/app-release.apk

$:
  tag_push:
    - name: release-apk
      docker:
        image: cirrusci/flutter:stable
        volumes:
          - flutter_gradle:/root/.gradle:rw
      stages:
        - name: 补全工程结构
          script: |
            set -e
            if [ ! -d android ]; then
              flutter create --platforms=android .
            fi
            rm -f lib/main.dart test/widget_test.dart
            mv main.dart api.dart models.dart lib/
        - name: 安装依赖
          script: flutter pub get
        - name: 静态分析
          script: flutter analyze
        - name: 构建 APK
          script: flutter build apk --release --no-pub
        - name: 发布 Release
          type: git:release
          options:
            title: $CNB_BRANCH
            description: 自动构建的 Android APK
        - name: 上传 APK 到 Release 附件（插件）
          image: cnbcool/attachments:latest
          settings:
            tag: $CNB_BRANCH
            attachments:
              - ./build/app/outputs/flutter-apk/app-release.apk
